keyword-hit: "<yellow>{player} 在 {channel}：关键词 {keyword}"
keywords-list: "<gold>关键词（{count}/{limit}）：<white>{list}"
keywords-disabled: "<gray>服务器已禁用关键词提醒。"
keywords-active: "<green>关键词提醒已启用。使用 /vchat keywords add|remove 短语 或 pause|resume 管理。"
keywords-paused: "<gray>关键词提醒已暂停，短语仍会保留。使用 /vchat keywords resume 恢复。"
