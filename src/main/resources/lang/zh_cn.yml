# 通过 Vystorm Core 提供的命令：每位玩家看到自己语言的说明、帮助和 Tab 补全。命令下直接的 "aliases" 是额外的主命令
# （全服生效；由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name"/"aliases" 在所有语言中
# 都可使用，英文始终有效。所有命令一览：/vhelp
commands:
  vchat:
    description: "聊天菜单、禁言、管理和重载"
    aliases: [聊天]
    sub:
      report:
        name: report
        aliases: []
        description: "举报玩家"
        args:
          player: PLAYER
          reason: REASON
      reports:
        name: reports
        aliases: []
        description: "玩家举报"
      menu:
        name: 菜单
        aliases: []
        description: "打开聊天菜单"
      mutes:
        name: 禁言列表
        aliases: []
        description: "被禁言的玩家（菜单；控制台中为列表）"
      announcements:
        name: announcements
        aliases: []
        description: "规划定时公告"
      moderation:
        name: 管理
        aliases: []
        description: "管理菜单：举报、慢速模式、聊天记录"
      emojis:
        name: 表情
        aliases: []
        description: "可输入的表情代码，例如 :heart:"
      keywords:
        name: 关键词
        aliases: []
        description: "个人关键词提醒"
        sub:
          add:
            name: 添加
            aliases: []
            description: "保存一个词或短语"
            args:
              phrase: 短语
          remove:
            name: 移除
            aliases: []
            description: "移除已保存的短语"
            args:
              phrase: 短语
          test:
            name: 测试
            aliases: []
            description: "私下预览关键词匹配"
            args:
              message: TEXT
          pause:
            name: 暂停
            aliases: []
            description: "暂停关键词提醒"
          resume:
            name: 恢复
            aliases: []
            description: "恢复关键词提醒"
      replylock:
        name: 锁定回复
        aliases: []
        description: "锁定或解锁当前 /r 回复对象，退出后自动解除"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"
  channel:
    description: "切换你发言的频道，或向该频道发送一条消息"
    aliases: [频道]
    args:
      channel: 频道
      message: 消息
    sub:
      list:
        name: 列表
        aliases: []
        description: "所有频道；点击一个即可在那里发言"
      join:
        name: 加入
        aliases: [显示]
        description: "重新显示一个频道"
        args:
          channel: 频道
      leave:
        name: 离开
        aliases: [隐藏]
        description: "隐藏一个频道"
        args:
          channel: 频道
  msg:
    description: "发送私聊消息"
    aliases: [私聊]
    args:
      player: 玩家
      message: 消息
  reply:
    description: "回复你收到的最后一条私聊"
    aliases: [回复]
    args:
      message: 消息
  ignore:
    description: "屏蔽或取消屏蔽一名玩家；不填名字则打开屏蔽列表"
    aliases: [屏蔽]
    args:
      player: 玩家
    sub:
      list:
        name: 列表
        aliases: []
        description: "你屏蔽的玩家"
  socialspy:
    description: "查看其他玩家的私聊和监听频道"
    aliases: [监听]
  mute:
    description: "禁言一名玩家一段时间（30m、2h、7d）或直到解除；不填名字则打开禁言列表"
    aliases: [禁言]
    args:
      player: 玩家
      time-reason: "[时间] [原因]"
  unmute:
    description: "解除一名玩家的禁言"
    aliases: [解除禁言]
    args:
      player: 玩家
  clearchat:
    description: "为所有人清空聊天（管理人员不受影响）"
    aliases: [清屏]
  slowmode:
    description: "为所有频道或某个频道开启慢速模式"
    aliases: [慢速]
    args:
      seconds: "秒数|关"
      channel: 频道

reply-lock-on: "<green>回复对象已锁定为 {player}，退出服务器后解除。使用 /vchat replylock 可解除锁定。"
