# Befehle über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" direkt unter einem Befehl
# sind zusätzliche Hauptbefehle (serverweit; der Admin wählt die Sprachen in Cores Konfig commands.localized-aliases);
# "name"/"aliases" eines Unterbefehls gehen in jeder Sprache, Englisch geht immer. Übersicht aller Befehle: /vhilfe
commands:
  vchat:
    description: "Chatmenü, Stummschaltungen, Moderation und Neuladen"
    aliases: []
    sub:
      report:
        name: report
        aliases: []
        description: "Spieler melden"
        args:
          player: PLAYER
          reason: REASON
      reports:
        name: reports
        aliases: []
        description: "Spielermeldungen"
      menu:
        name: menü
        aliases: [menue]
        description: "Chatmenü öffnen"
      mutes:
        name: stumm
        aliases: [stummliste]
        description: "Stummgeschaltete Spieler (Menü, in der Konsole eine Liste)"
      announcements:
        name: announcements
        aliases: []
        description: "Zeitgesteuerte Ankündigungen planen"
      moderation:
        name: moderation
        aliases: []
        description: "Moderationsmenü: Meldungen, Langsam-Modus, Chatprotokoll"
      emojis:
        name: emojis
        aliases: [emoji]
        description: "Emoji-Codes zum Eintippen, z. B. :heart:"
      keywords:
        name: stichworte
        aliases: []
        description: "Persönliche Stichwort-Hinweise"
        sub:
          add:
            name: hinzufügen
            aliases: []
            description: "Ein Wort oder eine Phrase speichern"
            args:
              phrase: PHRASE
          remove:
            name: entfernen
            aliases: []
            description: "Eine gespeicherte Phrase entfernen"
            args:
              phrase: PHRASE
          test:
            name: testen
            aliases: []
            description: "Stichwort-Treffer privat prüfen"
            args:
              message: TEXT
          pause:
            name: pausieren
            aliases: []
            description: "Stichwort-Hinweise pausieren"
          resume:
            name: fortsetzen
            aliases: []
            description: "Stichwort-Hinweise fortsetzen"
      replylock:
        name: antwortsperre
        aliases: []
        description: "Aktuellen /r-Partner bis zum Ausloggen festlegen oder freigeben"
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration und Sprachdateien neu laden"
  channel:
    description: "Den Kanal wechseln, in den du schreibst, oder eine Nachricht dorthin schreiben"
    aliases: [kanal]
    args:
      channel: KANAL
      message: NACHRICHT
    sub:
      list:
        name: liste
        aliases: []
        description: "Alle Kanäle; klicke einen an, um dort zu schreiben"
      join:
        name: beitreten
        aliases: [zeigen]
        description: "Einen Kanal wieder anzeigen"
        args:
          channel: KANAL
      leave:
        name: verlassen
        aliases: [ausblenden]
        description: "Einen Kanal ausblenden"
        args:
          channel: KANAL
  msg:
    description: "Eine private Nachricht schicken"
    aliases: [nachricht, flüstern]
    args:
      player: SPIELER
      message: NACHRICHT
  reply:
    description: "Auf deine letzte private Nachricht antworten"
    aliases: [antworten]
    args:
      message: NACHRICHT
  ignore:
    description: "Einen Spieler ignorieren oder nicht mehr ignorieren; ohne Namen öffnet sich die Ignorierliste"
    aliases: [ignorieren]
    args:
      player: SPIELER
    sub:
      list:
        name: liste
        aliases: []
        description: "Spieler, die du ignorierst"
  socialspy:
    description: "Private Nachrichten und Spionage-Kanäle anderer Spieler mitlesen"
    aliases: []
  mute:
    description: "Einen Spieler für eine Zeit (30m, 2h, 7d) oder bis zur Aufhebung stummschalten; ohne Namen öffnet sich die Liste"
    aliases: [stumm]
    args:
      player: SPIELER
      time-reason: "[ZEIT] [GRUND]"
  unmute:
    description: "Stummschaltung eines Spielers aufheben"
    aliases: [entstummen]
    args:
      player: SPIELER
  clearchat:
    description: "Den Chat für alle leeren (Teammitglieder ausgenommen)"
    aliases: [chatleeren]
  slowmode:
    description: "Langsam-Modus für alle Kanäle oder einen Kanal"
    aliases: [langsam]
    args:
      seconds: "SEKUNDEN|aus"
      channel: KANAL

reply-lock-on: "<green>Antwortpartner bis zum Ausloggen auf {player} festgelegt. Mit /vchat replylock wieder freigeben."
