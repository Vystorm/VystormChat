# Vystorm Chat - English. MiniMessage formatting, placeholders in {curly braces}.

vmenu-chat: "Chat"
vmenu-chat-desc: "Channels, private messages, ignore list and chat settings"

# ---------------------------------------------------------------- general
no-permission: "<red>You may not do that."
player-only: "<red>Only players can do that."
player-not-found: "<red>{player} is not online."
player-unknown: "<red>{player} has never played on this server."
invalid-duration: "<red>'{input}' is no duration. Examples: 30s, 10m, 2h, 7d, 1h30m."
permanent: "until unmuted"
all-channels: "all channels"
busy: "<red>The server is busy, please send your message again."
chat-failed: "<red>Your message could not be sent because of an error. Nobody else saw it; please try again or tell the staff."
settings-unavailable: "<red>The chat settings cannot be opened right now."
reloaded: "<green>Vystorm Chat reloaded: {channels} channels, hooks: {hooks}."
emojis-list: "<gold>Emojis <gray>– type the code in chat or a private message: <white>{list}"
emojis-off: "<gray>Emoji codes are switched off."
feature-off: "<red>This feature is switched off on this server."

usage-msg: "<gray>Use: <yellow>/msg PLAYER MESSAGE</yellow>"
usage-reply: "<gray>Use: <yellow>/r MESSAGE</yellow>"
usage-unmute: "<gray>Use: <yellow>/unmute PLAYER</yellow>"
usage-mute: "<gray>Use: <yellow>/mute PLAYER [TIME] [REASON]</yellow> <gray>with a time like 30m, 2h, 7d or <yellow>perm</yellow>"
usage-slowmode: "<gray>Use: <yellow>/slowmode SECONDS [CHANNEL]</yellow> <gray>or</gray> <yellow>/slowmode off [CHANNEL]</yellow>"

# ---------------------------------------------------------------- channels
channel-unknown: "<red>There is no channel '{channel}'. <gray>/channel list"
channel-focused: "<green>You now write in <white>{channel}</white>."
channel-no-write: "<red>You cannot write in {channel}."
channel-no-read: "<red>You cannot read {channel}."
channel-not-leavable: "<red>{channel} cannot be hidden."
channel-shown: "<green>You see {channel} again."
channel-hidden: "<gray>{channel} is hidden now. Show it again in the chat menu or with /channel join."
channel-wrong-world: "<red>{channel} is not available in this world."
channel-no-party: "<red>You are not in a party."
channel-no-city: "<red>You are not a member of a city."
channel-no-faction: "<red>You do not belong to a faction."
channel-no-region: "<red>You are not in an area with its own chat."
nobody-heard: "<gray>Nobody heard you in {channel}."
channel-list-header: "<gold>Channels <gray>(click to write there)"
channel-list-entry: "<gray>- <white>{channel}</white> {state} <dark_gray>prefix {prefix}"
channel-list-focus: "<green>(writing here)"
channel-list-listening: "<gray>(listening)"
channel-list-hidden: "<dark_gray>(hidden)"
channel-list-hover: "<gray>Click to write in {channel}"

# ---------------------------------------------------------------- sending
too-long: "<red>Your message is too long (at most {max} characters)."
cooldown: "<red>Please wait {time} before writing here again."
slow-mode-wait: "<red>Slow mode is on: you can write again in {time}."
spam-repeat: "<red>You just sent that. Please do not repeat yourself."
spam-flood: "<red>Slow down a little, you are writing too fast."
spam-caps: "<red>Please do not shout (too many capital letters)."
filter-blocked: "<red>Your message contains a word that is not allowed here."
link-blocked: "<red>You may not post links here."
cost-too-poor: "<red>A message in {channel} costs {price}, which you do not have."
muted: "<red>You are muted for {time}. Reason: <gray>{reason}"
muted-permanent: "<red>You are muted. Reason: <gray>{reason}"
mentioned-by: "<yellow>{player} mentioned you in {channel}"
spy-prefix: "<dark_gray>[Spy] "
timestamp-hover: "<gray>Sent at <white>{time}"
link-hover: "<gray>Click to open\n<dark_gray>{url}"

hover-card:
  name: "<gold>{name}"
  rank: "<gray>Rank: <white>{rank}"
  world: "<gray>World: <white>{world}"
  playtime: "<gray>Play time: <white>{time}"
  party: "<gray>Party: <light_purple>{party}"
  city: "<gray>City: <yellow>{city}"
  faction: "<gray>Faction: <aqua>{faction}"
  click: "<yellow>Click to send {player} a message"

showcase-empty-hand: "<gray>[empty hand]"
showcase-inventory: "<aqua>[Inventory of {player}]"
showcase-inventory-hover: "<gray>Click to look at the inventory of {player}"
showcase-inventory-title: "Inventory of {player}"
