# ---------------------------------------------------------------- private messages
msg-self: "<red>You cannot message yourself."
msg-you-ignore: "<red>You ignore {player}. Unignore them first with /ignore {player}."
msg-not-accepted: "<red>{player} does not accept your private messages."
msg-name-hover: "<gray>Click to answer {player}"
reply-nobody: "<red>Nobody has written to you yet."
reply-offline: "<red>The player you last talked to is not online anymore."
spy-on: "<green>Social spy is on: you see private messages and spy channels."
