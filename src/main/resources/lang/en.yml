# ---------------------------------------------------------------- ignore
ignore-self: "<red>You cannot ignore yourself."
ignore-exempt: "<red>{player} cannot be ignored."
ignore-on: "<gray>You now ignore {player}: no chat and no private messages from them."
ignore-off: "<green>You no longer ignore {player}."
ignore-list-empty: "<gray>You do not ignore anyone."
ignore-list: "<gray>You ignore: <white>{players}"

# ---------------------------------------------------------------- moderation
chat-cleared: "<gray>The chat was cleared by {player}."
slow-mode-on: "<gold>Slow mode: one message every {time} ({channel})."
slow-mode-off: "<green>Slow mode is off ({channel})."
