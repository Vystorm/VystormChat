# Commands through Vystorm Core: description, help and tab completion per player. "aliases" directly under a command are
# extra root commands (server-wide; the admin chooses the languages in Core's config commands.localized-aliases);
# "name"/"aliases" of a subcommand work in every language, English always works. Overview of all commands: /vhelp
commands:
  discord:
    description: "Invite link to the Discord server"
    aliases: []
  vchat:
    description: "Chat menu, mutes, moderation and reload"
    aliases: []
    sub:
      discord:
        name: discord
        aliases: []
        description: "Discord bridge: status and test line"
        sub:
          status:
            name: "status"
            aliases: []
            description: "Connection, queue and last error"
          test:
            name: "test"
            aliases: []
            description: "Send a test line to the Discord side of a channel"
            args:
              channel: "CHANNEL"
      report:
        name: report
        aliases: []
        description: "Report a player"
        args:
          player: PLAYER
          reason: REASON
      reports:
        name: reports
        aliases: []
        description: "Player reports"
      menu:
        name: menu
        aliases: []
        description: "Open the chat menu"
      mutes:
        name: mutes
        aliases: []
        description: "Muted players (menu, or a list in the console)"
      announcements:
        name: announcements
        aliases: []
        description: "Plan timed announcements"
      moderation:
        name: moderation
        aliases: []
        description: "Moderation menu: reports, slow mode, chat log"
      emojis:
        name: emojis
        aliases: [emoji]
        description: "Emoji codes you can type, like :heart:"
      keywords:
        name: keywords
        aliases: []
        description: "Personal keyword alerts"
        sub:
          add:
            name: add
            aliases: []
            description: "Save a literal word or phrase"
            args:
              phrase: PHRASE
          remove:
            name: remove
            aliases: []
            description: "Remove a saved phrase"
            args:
              phrase: PHRASE
          test:
            name: test
            aliases: []
            description: "Privately preview a keyword match"
            args:
              message: TEXT
          pause:
            name: pause
            aliases: []
            description: "Pause keyword alerts"
          resume:
            name: resume
            aliases: []
            description: "Resume keyword alerts"
      replylock:
        name: replylock
        aliases: []
        description: "Lock or unlock your current /r partner until logout"
      reload:
        name: reload
        aliases: []
        description: "Reload config and language files"
  channel:
    description: "Switch the channel you write in, or write one message there"
    aliases: []
    args:
      channel: CHANNEL
      message: MESSAGE
    sub:
      list:
        name: list
        aliases: []
        description: "All channels; click one to write there"
      join:
        name: join
        aliases: []
        description: "Show a channel again"
        args:
          channel: CHANNEL
      leave:
        name: leave
        aliases: []
        description: "Hide a channel"
        args:
          channel: CHANNEL
  msg:
    description: "Send a private message"
    aliases: []
    args:
      player: PLAYER
      message: MESSAGE
  reply:
    description: "Answer your last private message"
    aliases: []
    args:
      message: MESSAGE
  ignore:
    description: "Ignore or unignore a player; without a name the ignore list opens"
    aliases: []
    args:
      player: PLAYER
    sub:
      list:
        name: list
        aliases: []
        description: "Players you ignore"
  socialspy:
    description: "See private messages and spy channels of other players"
    aliases: []
  mute:
    description: "Mute a player for a time (30m, 2h, 7d) or until unmuted; without a name the mute list opens"
    aliases: []
    args:
      player: PLAYER
      time-reason: "[TIME] [REASON]"
  unmute:
    description: "Unmute a player"
    aliases: []
    args:
      player: PLAYER
  clearchat:
    description: "Clear the chat for everyone (staff stay unaffected)"
    aliases: []
  slowmode:
    description: "Slow mode for all channels or one channel"
    aliases: []
    args:
      seconds: "SECONDS|off"
      channel: CHANNEL

reply-lock-on: "<green>Reply partner locked to {player} until you log out. Use /vchat replylock to unlock."
reply-lock-off: "<green>Reply partner unlocked; /r follows your latest private conversation again."

keyword-hit: "<yellow>{player} in {channel}: keyword {keyword}"
keywords-list: "<gold>Keywords ({count}/{limit}): <white>{list}"
keywords-disabled: "<gray>Keyword alerts are disabled by the server."
keywords-active: "<green>Keyword alerts active. Manage with /vchat keywords add|remove PHRASE or pause|resume."
keywords-paused: "<gray>Keyword alerts paused. Phrases remain saved; /vchat keywords resume enables them again."
keyword-added: "<green>Keyword saved. Literal matches ignore letter case."
keyword-invalid: "<red>Use a unique phrase of 2-48 characters without control characters. Limit: {limit} phrases."
keyword-removed: "<green>Keyword removed."
keyword-missing: "<red>That phrase is not on your keyword list."

keyword-test-hit: "<green>Preview: matches {keyword}. This text was not sent to chat."
keyword-test-miss: "<gray>Preview: no match among your active saved phrases."

