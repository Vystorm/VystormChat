title: 'Чат'
pages:
  - title: 'Каналы'
    text: |
      /vchat открывает меню чата. Переключайте каналы (общий, локальный, торговый…) через /channel.
  - title: 'Сообщения и показ предметов'
    text: |
      /msg PLAYER — личное сообщение, /reply — ответ. Пишите [item], чтобы показать предмет, и :heart: для эмодзи.
  - title: 'Тишина и безопасность'
    text: |
      /ignore PLAYER скрывает человека, оповещения о словах предупредят вас, а нарушителей можно пожаловаться.
      Введите /vchat help, чтобы увидеть все команды.
